{% extends "base.html" %}

{% block title %}Create Course - Capacity Connect{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-sm">
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
      <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
        <i data-lucide="book-plus" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Create Capacity Building Course</h1>
        <p class="text-xs text-slate-500">Design a new course curriculum with modules and competency goals</p>
      </div>
    </div>

    <form method="POST" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Course Code *</label>
          <input type="text" name="code" required placeholder="e.g. CLD-302, PM-201" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Course Title *</label>
          <input type="text" name="title" required placeholder="e.g. Advanced Cloud Microservices" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Category *</label>
          <select name="category" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="Technology">Technology</option>
            <option value="Management">Management</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Leadership">Leadership</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Proficiency Level</label>
          <select name="level" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Estimated Duration</label>
          <input type="text" name="duration" value="4 Weeks" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Overview & Description *</label>
        <textarea name="description" rows="3" required placeholder="Detailed description of outcomes and core learning objectives..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Curriculum / Modules (1 per line)</label>
        <textarea name="syllabus" rows="4" placeholder="Module 1: Foundations&#10;Module 2: Core Architecture&#10;Module 3: Hands-on Lab" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Banner Image URL</label>
          <input type="url" name="thumbnail_url" placeholder="https://images.unsplash.com/..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Assigned Lead Trainer</label>
          <select name="trainer_id" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
            {% for t in trainers %}
              <option value="{{ t.id }}">{{ t.name }} ({{ t.job_title }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <input type="checkbox" id="is_featured" name="is_featured" value="1" class="rounded text-indigo-600 focus:ring-indigo-500">
        <label for="is_featured" class="text-xs font-semibold text-slate-700 cursor-pointer">Feature this course on homepage</label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <a href="{{ url_for('courses.list_courses') }}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">Cancel</a>
        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md transition">Publish Course</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
