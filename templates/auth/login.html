{% extends "base.html" %}

{% block title %}Sign In - Capacity Connect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
  <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600/10 text-indigo-600 flex items-center justify-center mx-auto mb-3 border border-indigo-100">
        <i data-lucide="graduation-cap" class="w-7 h-7"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Capacity Connect</h2>
      <p class="text-xs text-slate-500 mt-1">Sign in to access your capacity building portal</p>
    </div>

    <!-- Quick Role Tester Cards -->
    <div class="mb-6 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center justify-between">
        <span>Instant Demo Access:</span>
        <span class="text-indigo-600 font-semibold">1-Click</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <a href="{{ url_for('auth.quick_login', role='admin') }}" class="py-2 px-1 bg-white hover:bg-indigo-50 border border-slate-200 rounded-xl font-semibold text-slate-800 hover:text-indigo-700 transition shadow-sm">
          <div class="text-[10px] text-purple-600 font-bold uppercase">Admin</div>
          <div>Mayank</div>
        </a>
        <a href="{{ url_for('auth.quick_login', role='trainer') }}" class="py-2 px-1 bg-white hover:bg-indigo-50 border border-slate-200 rounded-xl font-semibold text-slate-800 hover:text-indigo-700 transition shadow-sm">
          <div class="text-[10px] text-amber-600 font-bold uppercase">Trainer</div>
          <div>Dr. Sarah</div>
        </a>
        <a href="{{ url_for('auth.quick_login', role='trainee') }}" class="py-2 px-1 bg-white hover:bg-indigo-50 border border-slate-200 rounded-xl font-semibold text-slate-800 hover:text-indigo-700 transition shadow-sm">
          <div class="text-[10px] text-emerald-600 font-bold uppercase">Trainee</div>
          <div>Alex</div>
        </a>
      </div>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </div>
          <input type="email" name="email" required placeholder="name@capacityconnect.org" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input type="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
        </div>
      </div>

      <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2">
        <span>Sign In</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="font-bold text-indigo-600 hover:text-indigo-800 ml-1">Create Account &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
