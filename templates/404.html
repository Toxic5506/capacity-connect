{% extends "base.html" %}

{% block title %}Page Not Found - Capacity Connect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16 space-y-4">
  <div class="w-20 h-20 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto shadow-sm">
    <i data-lucide="compass" class="w-10 h-10"></i>
  </div>
  <h1 class="text-3xl font-extrabold text-slate-900">Page Not Found</h1>
  <p class="text-xs text-slate-500">The requested section or resource could not be located in Capacity Connect.</p>
  <div>
    <a href="{{ url_for('home') }}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition">
      <i data-lucide="home" class="w-4 h-4"></i>
      <span>Return Home</span>
    </a>
  </div>
</div>
{% endblock %}
